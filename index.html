<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Rush</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#9f7178,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:#fff;
}

#game{text-align:center;}

input{
    padding:10px;
    margin:5px;
    font-size:16px;
    border-radius:6px;
    border:none;
}

button{
    padding:10px 22px;
    font-size:16px;
    border:none;
    border-radius:20px;
    background:white;
    color:#ff4d6d;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

#board{
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    box-shadow:0 0 30px rgba(255,255,255,0.4);
    position:relative;
    margin:20px auto;
}

.box{
    width:50px;
    height:50px;
    position:absolute;
    background:rgba(255,255,255,0.7);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.heart{ background:#ffe1e8; }

.token{
    width:18px;
    height:18px;
    border-radius:50%;
    background:red;
}

.token.blue{ background:#2196f3; }

#dice{
    font-size:60px;
    margin:10px;
    transition:transform 0.4s ease;
}

#overlay, #rulesOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    padding:35px;
    border-radius:15px;
    text-align:center;
    color:#333;
    max-width:360px;
}

#winnerHeart{font-size:80px;}

footer{
    position:fixed;
    bottom:10px;
    font-size:14px;
    opacity:.9;
}
</style>
</head>

<body>

<div id="game">
    <h1 style="font-family:cursive;">❤️ Heart Rush</h1>

    <div id="setup">
        <input id="p1" placeholder="Player 1 Name"><br>
        <input id="p2" placeholder="Player 2 Name"><br><br>
        <button onclick="startGame('friend')">Play with Friend</button>
        <button onclick="startGame('ai')">Play with Computer</button><br>
        <button onclick="openRules()">📖 How to Play</button>
    </div>

    <h2 id="turn"></h2>
    <div id="board"></div>

    <div id="dice">🎲</div>
    <button onclick="rollDice()">Roll Dice</button>
</div>

<footer>
    Created by <strong>Nandini Sawwalakhe</strong>
</footer>

<!-- WIN OVERLAY -->
<div id="overlay">
    <div class="card">
        <div id="winnerHeart">❤️</div>
        <h1>WINNER</h1>
        <h2 id="winnerName"></h2><br>
        <button onclick="restart()">Restart</button>
        <button onclick="menu()">Main Menu</button>
    </div>
</div>

<!-- RULES OVERLAY -->
<div id="rulesOverlay">
    <div class="card">
        <h2>📖 How to Play</h2>
        <p style="text-align:left;">
        🎲 Roll the dice on your turn.<br><br>
        🔄 Player 1 moves clockwise, Player 2 anticlockwise.<br><br>
        ❤️ Reach your heart first to win.<br><br>
        🤖 Play against a friend or the computer.
        </p>
        <button onclick="closeRules()">Close</button>
    </div>
</div>

<!-- SOUNDS -->
<audio id="diceSound" src="/dice.mp3"></audio>
<audio id="winSound" src="/win.mp3"></audio>

<script>
const TOTAL=16;
const HEARTS={0:8,1:9};

let boxes=[],pos=0,player=0,mode=null;
let moving=false,gameOver=false;
let names=["",""];

const board=document.getElementById("board");
const dice=document.getElementById("dice");
const diceSound=document.getElementById("diceSound");
const winSound=document.getElementById("winSound");

function createBoard(){
    board.innerHTML="";
    boxes=[];
    const r=170;

    for(let i=0;i<TOTAL;i++){
        const b=document.createElement("div");
        b.className="box";
        const angle=(360/TOTAL)*i-90;
        b.style.left=210+r*Math.cos(angle*Math.PI/180)-25+"px";
        b.style.top=210+r*Math.sin(angle*Math.PI/180)-25+"px";

        if(i===0)b.textContent="⬅️";
        if(i===1)b.textContent="➡️";
        if(i===8||i===9){b.classList.add("heart");b.textContent="❤️";}

        board.appendChild(b);
        boxes.push(b);
    }
    placeToken();
}

function placeToken(){
    document.querySelectorAll(".token").forEach(t=>t.remove());
    const t=document.createElement("div");
    t.className="token";
    if([0,9,10,11,12,13,14,15].includes(pos)) t.classList.add("blue");
    boxes[pos].appendChild(t);
}

function startGame(m){
    mode=m;
    names[0]=p1.value||"Player 1";
    names[1]=m==="ai"?"Computer 🤖":(p2.value||"Player 2");
    setup.style.display="none";
    createBoard();
    updateTurn();
}

function updateTurn(){
    turn.textContent=`${names[player]}'s Turn`;
}

function rollDice(){
    if(gameOver||moving) return;
    dice.textContent="🎲";
    diceSound.currentTime=0;
    diceSound.play();
    dice.style.transform="rotate(360deg) scale(1.3)";
    const roll=Math.floor(Math.random()*6)+1;

    setTimeout(()=>{
        dice.textContent=roll;
        dice.style.transform="rotate(0) scale(1)";
    },400);

    setTimeout(()=>move(roll),900);
}

function move(steps){
    moving=true;
    let count=0;
    const dir=player===0?1:-1;

    function step(){
        const next=(pos+dir+TOTAL)%TOTAL;
        pos=next;
        placeToken();
        count++;

        if(next===HEARTS[player]){
            win();
            return;
        }

        if(count<steps){
            setTimeout(step,250);
        }else{
            player=1-player;
            updateTurn();
            moving=false;
            if(mode==="ai"&&player===1) setTimeout(rollDice,800);
        }
    }
    step();
}

function win(){
    gameOver=true;
    winSound.play();
    winnerName.textContent=names[player];
    overlay.style.display="flex";
}

function restart(){
    pos=0;player=0;moving=false;gameOver=false;
    overlay.style.display="none";
    dice.textContent="🎲";
    createBoard();
    updateTurn();
}

function menu(){location.reload();}

function openRules(){rulesOverlay.style.display="flex";}
function closeRules(){rulesOverlay.style.display="none";}
</script>

</body>
</html>
